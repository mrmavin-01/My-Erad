name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: $HOME/android-sdk
      ANDROID_SDK_ROOT: $HOME/android-sdk

    steps:
      # Step 1: Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set Up Android SDK
      - name: Set up Android SDK
        run: |
          # Create directories
          mkdir -p $HOME/android-sdk/cmdline-tools
          
          # Download the latest command line tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O android-sdk.zip
          unzip -q android-sdk.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

          # Accept licenses for SDK tools
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses

          # Install required SDK packages (platform-tools, build-tools, platforms)
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;30.0.3" \
            "platforms;android-31"

      # Step 3: Cache Buildozer Files
      - name: Cache Buildozer directories
        uses: actions/cache@v3
        with:
          path: |
            .buildozer
            .gradle
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v3

      # Step 4: Install Buildozer
      - name: Install Buildozer and dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv libffi-dev libssl-dev zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython

      # Step 5: Build APK
      - name: Build APK with Buildozer
        run: buildozer android debug

      # Step 6: Upload APK Artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: APK
          path: bin/*.apk
