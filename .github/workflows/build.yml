name: Build KivyMD APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install buildozer
        pip install cython

    - name: Set up Android SDK
      run: |
        mkdir -p $HOME/.buildozer/android/platform
        cd $HOME/.buildozer/android/platform
        wget https://dl.google.com/android/repository/commandlinetools-linux-8092744_latest.zip
        unzip commandlinetools-linux-8092744_latest.zip -d cmdline-tools
        rm commandlinetools-linux-8092744_latest.zip
        yes | sdkmanager --sdk_root=$HOME/.buildozer/android/platform cmdline-tools latest
        yes | sdkmanager --licenses
        yes | sdkmanager "build-tools;36.0.0-rc3"
        yes | sdkmanager "extras;google;m2repository"

    - name: Build the APK
      run: |
        buildozer android debug
