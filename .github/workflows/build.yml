name: Build and Deploy Kivy App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v3

    # Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    # Install dependencies
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip python3-dev build-essential libssl-dev libffi-dev python3-setuptools
        pip install --upgrade pip
        pip install buildozer

    # Install required dependencies for Kivy
    - name: Install Kivy dependencies
      run: |
        sudo apt-get install -y libgl1-mesa-glx libgles2-mesa libxi-dev libxmu-dev
        sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev

    # Install Android SDK and NDK (required for Android builds)
    - name: Install Android SDK and NDK
      run: |
        wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O android-tools.zip
        unzip android-tools.zip -d $HOME/android-sdk
        mkdir -p $HOME/android-sdk/cmdline-tools/latest
        mv $HOME/android-sdk/cmdline-tools/* $HOME/android-sdk/cmdline-tools/latest/
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;33.0.0" "platforms;android-33" "ndk;23.1.7779620"

    # Run the Buildozer build
    - name: Build APK with Buildozer
      run: |
        buildozer android debug
        buildozer android deploy run

    # Upload APK
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: APK
        path: bin/*.apk
