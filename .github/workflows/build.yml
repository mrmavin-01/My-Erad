name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: $HOME/android-sdk
      ANDROID_SDK_ROOT: $HOME/android-sdk
      PATH: $ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH

    steps:
      # Step 1: Install required tools (tar and others)
      - name: Install required tools
        run: |
          apt update
          apt install -y tar

      # Step 2: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 3: Install Java JDK (Java 17 for compatibility)
      - name: Install Java JDK
        run: |
          apt update
          apt install -y openjdk-17-jdk

      # Step 4: Set up Android SDK
      - name: Set up Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O android-sdk.zip
          unzip -q android-sdk.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "ndk;23.1.7779620"

      # Step 5: Cache Buildozer directories (optional)
      - name: Cache Buildozer directories
        uses: actions/cache@v3
        with:
          path: |
            .buildozer
            .gradle
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v3

      # Step 6: Install Buildozer and dependencies
      - name: Install Buildozer and dependencies
        run: |
          apt update
          apt install -y python3-pip python3-venv libffi-dev libssl-dev zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython
          pip install python-for-android

      # Step 7: Ensure python-for-android Directory
      - name: Ensure python-for-android Directory
        run: |
          mkdir -p .buildozer/android/platform/python-for-android

      # Step 8: Build APK with Buildozer (Verbose)
      - name: Build APK with Buildozer
        run: |
          buildozer android clean
          buildozer android debug -v | tee build_output.log
        continue-on-error: true  # Allow the build to continue even if errors occur, for log analysis

      # Step 9: Upload Build Logs
      - name: Upload Build Logs
        uses: actions/upload-artifact@v3
        with:
          name: Build Logs
          path: build_output.log

      # Step 10: Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: APK
          path: bin/*.apk
