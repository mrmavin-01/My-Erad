name: Build APK

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: $HOME/android-sdk
      ANDROID_SDK_ROOT: $HOME/android-sdk

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Install Java JDK
      - name: Install Java JDK
        run: |
          sudo apt update
          sudo apt install -y openjdk-11-jdk

      # Step 3: Set up Android SDK
      - name: Set up Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O android-sdk.zip
          unzip -q android-sdk.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --install "platform-tools" "build-tools;30.0.3" "platforms;android-31" "ndk;21.4.7075529"

      # Step 4: Cache Buildozer directories (optional)
      - name: Cache Buildozer directories
        uses: actions/cache@v3
        with:
          path: |
            .buildozer
            .gradle
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v3

      # Step 5: Install Buildozer and dependencies
      - name: Install Buildozer and dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv libffi-dev libssl-dev zlib1g-dev
          pip install --upgrade pip
          pip install buildozer cython
          pip install python-for-android==2023.9.16  # Updated to a compatible version

      # Step 6: Ensure python-for-android Directory
      - name: Ensure python-for-android Directory
        run: mkdir -p .buildozer/android/platform/python-for-android

      # Step 7: Build APK with Buildozer (Verbose)
      - name: Build APK with Buildozer (Verbose)
        run: |
          buildozer -v android clean
          buildozer -v android debug | tee build_output.log
        continue-on-error: true  # Allow the build to continue even if errors occur, for log analysis

      # Step 8: Upload Build Logs
      - name: Upload Build Logs
        uses: actions/upload-artifact@v3
        with:
          name: Build Logs
          path: build_output.log

      # Step 9: Upload APK artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: APK
          path: bin/*.apk
