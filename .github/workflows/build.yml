name: CI
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /home/ubuntu/android-sdk  # Correct path for storing Android SDK
      ANDROID_SDK_ROOT: /home/ubuntu/android-sdk

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install dependencies
      - name: Set up Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget https://dl.google.com/android/repository/commandlinetools-linux-8512546_latest.zip -O android-sdk.zip
          mkdir -p /home/ubuntu/android-sdk/cmdline-tools
          unzip -q android-sdk.zip -d /home/ubuntu/android-sdk/cmdline-tools
          mv /home/ubuntu/android-sdk/cmdline-tools/cmdline-tools /home/ubuntu/android-sdk/cmdline-tools/latest
          yes | /home/ubuntu/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses
          /home/ubuntu/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-31"

      # Cache Buildozer global directory
      - name: Cache Buildozer global directory
        uses: actions/cache@v3
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      # Cache Buildozer working directory
      - name: Cache Buildozer working directory
        uses: actions/cache@v3
        with:
          path: .buildozer
          key: buildozer-${{ github.sha }}-${{ github.ref }}

      # Run Buildozer to build APK
      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: master

      # Upload the APK as an artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v3
        with:
          name: package
          path: bin/*.apk
