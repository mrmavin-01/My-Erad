name: CI
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - uses: actions/checkout@v2

      # Clear Git config if needed
      - name: Clear Git config
        run: |
          git config --global --get http.https://github.com/.extraheader && git config --global --unset-all http.https://github.com/.extraheader || echo "No extraheader to unset"

      # used to cache dependencies with a timeout
      - name: Get Date
        id: get-date
        run: |
          echo "date=$(/bin/date -u "+%Y%m%d")" >> $GITHUB_ENV
        shell: bash

      - name: Cache Buildozer global directory
        uses: actions/cache@v3
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - uses: actions/cache@v3
        with:
          path: .buildozer
          key: ${{ runner.os }}-${{ env.date }}-${{ hashFiles('buildozer.spec') }}

      # Upgrade pip and install dependencies
      - name: Upgrade pip and install dependencies
        run: |
          /bin/python3 -m pip install --upgrade pip
          /bin/python3 -m pip install -q --user appdirs colorama>=0.3.3 jinja2 'sh>=1.10, <2.0' build toml packaging setuptools

      - name: Build with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer android debug
          buildozer_version: stable

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.buildozer.outputs.filename }}
